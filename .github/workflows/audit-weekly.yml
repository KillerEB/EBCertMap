name: Weekly link audit

# Full network audit: hits every official_url and checks for dead links,
# redirects, price drift, and discontinued certs. Opens an issue when it finds
# something, and updates that same issue on later runs instead of piling up.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Not --strict: transient network noise should not fail the run. The audit
      # still exits non-zero on criticals, so keep going and report either way.
      - name: Run full audit
        id: audit
        continue-on-error: true
        run: node scripts/audit.js

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-audit-report
          path: |
            scripts/audit-report.md
            scripts/audit-results.json
          if-no-files-found: ignore

      - name: Open or update audit issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'scripts/audit-report.md';
            if (!fs.existsSync(path)) {
              core.setFailed('No audit report was produced');
              return;
            }

            const report = fs.readFileSync(path, 'utf8');
            const countFor = (label) => {
              const row = report
                .split(String.fromCharCode(10))
                .find(l => l.startsWith('|') && l.includes(label));
              if (!row) return 0;
              const n = Number(row.split('|').map(s => s.trim())[2]);
              return Number.isFinite(n) ? n : 0;
            };
            const counts = {
              Critical: countFor('Critical'),
              Warning: countFor('Warning'),
              Schema: countFor('Schema'),
            };

            if (!counts.Critical && !counts.Warning && !counts.Schema) {
              core.info('Audit clean — no issue opened.');
              return;
            }

            // GitHub issue bodies cap at 65536 chars.
            const LIMIT = 60000;
            const body = report.length > LIMIT
              ? report.slice(0, LIMIT) + '\n\n_(report truncated — see the workflow artifact for the full version)_'
              : report;

            const TITLE = 'Weekly cert link audit';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'audit',
            });
            const existing = open.find(i => i.title.startsWith(TITLE));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Re-run ${new Date().toISOString().split('T')[0]}: ${counts.Critical} critical, ${counts.Warning} warnings, ${counts.Schema} schema.`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${TITLE} — ${counts.Critical} critical, ${counts.Warning} warnings`,
                body,
                labels: ['audit'],
              });
            }
