name = "ebcertmap"
compatibility_date = "2026-04-20"

[assets]
directory = "./dist"
# Unmatched paths fall back to the SPA shell so client-side routes still resolve.
# Prerendered files (/, /skills, /roles, /cert/<id>) are real assets and are
# served directly; this only catches what is not on disk.
not_found_handling = "single-page-application"

# Serve /cert/<id> directly instead of redirecting to /cert/<id>/. The default
# (auto-trailing-slash) 307s to the slashed form, which would make every emitted
# canonical URL and all 429 sitemap entries point at a redirect.
html_handling = "drop-trailing-slash"
